<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wolf64 Music</title>
  <style>
:root {
  --bg: #12141a;
  --panel: #1c1f28;
  --border: #2e3340;
  --text: #e4e6eb;
  --muted: #8b91a0;
  --accent: #d4a017;
  --danger: #c44;
  --btn: #2a3040;
  --btn-hover: #3a4258;
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
}

body {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

h1 {
  margin: 0;
  font-size: 1.15rem;
  letter-spacing: 0.04em;
  color: var(--accent);
}

h2 {
  margin: 0 0 0.5rem;
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  font-weight: 600;
}

button, select, input[type="text"] {
  background: var(--btn);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 0.35rem 0.65rem;
  font-size: 0.8rem;
  border-radius: 2px;
}

button { cursor: pointer; }
button:hover, select:hover, input[type="text"]:hover { background: var(--btn-hover); }
button.active { border-color: var(--accent); color: var(--accent); }
button:disabled { opacity: 0.45; cursor: default; }

.toolbar {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 0.6rem 1rem;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
  flex: 0 0 auto;
}

.toolbar-actions { display: flex; gap: 0.4rem; }

.status {
  margin: 0;
  font-size: 0.8rem;
  color: var(--muted);
  flex: 1;
  text-align: right;
}
.status.error { color: #f88; }

.file-gate {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
  background: rgba(0, 0, 0, 0.55);
  padding: 1rem;
}
.file-gate.hidden { display: none; }
.file-gate-card {
  width: min(24rem, 100%);
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 1.1rem 1.2rem 1.2rem;
}
.file-gate-card h2 {
  margin-bottom: 0.65rem;
  text-transform: none;
  letter-spacing: 0.02em;
  color: var(--text);
  font-size: 1rem;
}
.file-gate-card p { margin: 0 0 1rem; font-size: 0.85rem; line-height: 1.4; color: var(--muted); }
.file-gate-primary { border-color: var(--accent); color: var(--accent); }

.layout {
  display: grid;
  grid-template-columns: 260px 1fr 344px;
  flex: 1;
  min-height: 0;
}

.left, .right {
  background: var(--panel);
  padding: 0.75rem;
  min-height: 0;
  min-width: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.left { border-right: 1px solid var(--border); }
.right { border-left: 1px solid var(--border); }

.song-list, .line-list {
  list-style: none;
  margin: 0;
  padding: 0;
  overflow: auto;
}
.song-list { flex: 0 1 auto; max-height: 11rem; margin-bottom: 0.75rem; }
.line-list { flex: 1; }

.song-list button, .line-list .line-name {
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  border: none;
  padding: 0.28rem 0.35rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.song-list button.current, .line-list .line-row.current .line-name { color: var(--accent); }

.line-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 0.25rem;
  align-items: center;
  margin-bottom: 0.15rem;
}
.line-row button.tiny, .voice-chip {
  padding: 0.15rem 0.35rem;
  font-size: 0.72rem;
}
.voice-chip.drum { color: var(--accent); }

.center {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  padding: 0.75rem 1rem;
}
.center-heading {
  display: flex;
  align-items: baseline;
  gap: 0.75rem;
  margin-bottom: 0.4rem;
}
.center-heading h2 { margin: 0; }
.center-heading p {
  margin: 0;
  margin-left: auto;
  color: var(--muted);
  font-size: 0.75rem;
}
.score-scroll {
  flex: 1;
  min-height: 0;
  overflow: auto;
  border: 1px solid var(--border);
  background: #0e1016;
}
.score-stack { position: relative; }
#score, #playhead { display: block; }
#playhead {
  position: absolute;
  left: 0;
  top: 0;
  pointer-events: none;
}
.hint {
  margin: 0.45rem 0 0;
  text-align: center;
  color: var(--muted);
  font-size: 0.75rem;
}

.inspector { overflow: auto; flex: 1; }
.field {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  margin-bottom: 0.7rem;
  font-size: 0.8rem;
}
.field span { color: var(--muted); }
.field input[type="text"], .field select { width: 100%; }
.check {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  margin-bottom: 0.55rem;
  font-size: 0.85rem;
}
.muted { color: var(--muted); font-size: 0.8rem; line-height: 1.35; }
.size-line { font-variant-numeric: tabular-nums; }
.size-line.over { color: #f88; }
.inst-list {
  list-style: none;
  margin: 0.35rem 0 0;
  padding: 0;
  max-height: 16rem;
  overflow: auto;
  border: 1px solid var(--border);
}
.inst-list button {
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  border: none;
  border-radius: 0;
  padding: 0.22rem 0.4rem;
}
.inst-list button.current { color: var(--accent); }
.field-label { margin: 0 0 0.25rem; font-size: 0.8rem; color: var(--muted); }
.kit-list {
  list-style: none;
  margin: 0 0 0.7rem;
  padding: 0;
  border: 1px solid var(--border);
}
.kit-row {
  display: grid;
  grid-template-columns: 1fr 3.4rem;
  align-items: center;
  border-bottom: 1px solid var(--border);
}
.kit-row:last-child { border-bottom: none; }
.kit-row:first-child { grid-template-columns: 1fr; }
.kit-pick {
  display: flex;
  justify-content: space-between;
  gap: 0.5rem;
  background: transparent;
  border: none;
  border-radius: 0;
  padding: 0.25rem 0.4rem;
  text-align: left;
  min-width: 0;
}
.kit-ins { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kit-row.current .kit-name, .kit-row.current .kit-ins { color: var(--accent); }
.kit-pitch {
  width: 100%;
  background: var(--btn);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 0.15rem 0.25rem;
  font-size: 0.75rem;
}

  </style>
</head>
<body>
  <header class="toolbar">
    <h1>Wolf64</h1>
    <div class="toolbar-actions">
      <button type="button" id="btn-folder">Music folder</button>
      <button type="button" id="btn-midi">Play MIDI</button>
      <button type="button" id="btn-sid">Play SID</button>
      <button type="button" id="btn-stop">Stop</button>
      <button type="button" id="btn-export">Export SID</button>
    </div>
    <p id="status" class="status" role="status"></p>
  </header>
  <main class="layout">
    <aside class="left">
      <h2>Songs</h2>
      <ul id="song-list" class="song-list"></ul>
      <div class="toolbar-actions">
        <button type="button" id="btn-song">Song</button>
      </div>
      <h2>Lines</h2>
      <ul id="line-list" class="line-list"></ul>
    </aside>
    <section class="center">
      <div class="center-heading">
        <h2>Stave</h2>
        <p id="score-meta"></p>
      </div>
      <div class="score-scroll" id="score-scroll">
        <div class="score-stack">
          <canvas id="score"></canvas>
          <canvas id="playhead"></canvas>
        </div>
      </div>
      <p class="hint">Click a line to edit it. Shared SID voices are merged. Drums stay on one voice.</p>
    </section>
    <aside class="right">
      <div class="inspector" id="inspector"></div>
    </aside>
  </main>
  <div class="file-gate" id="file-gate">
    <div class="file-gate-card">
      <h2>Open the music folder</h2>
      <p>Choose the Wolf64 <code>music</code> folder. MIDI files stay untouched. Mute, merge, and instrument choices are saved beside them.</p>
      <button type="button" id="btn-gate" class="file-gate-primary">Choose folder</button>
    </div>
  </div>

const FRAME_HZ = 50;

function gmName(program) {
  if (program == null || program < 0 || program >= GM_NAMES.length) return "Instrument";
  return GM_NAMES[program];
}

function lineLabel(line) {
  const ch = line.channel + 1;
  if (line.channel === PERCUSSION_CHANNEL) return `Ch ${ch}  Percussion`;
  return `Ch ${ch}  ${gmName(line.program)}`;
}

function readVarLen(data, pos) {
  let value = 0;
  for (let i = 0; i < 4; i++) {
    const b = data[pos.index++];
    value = (value << 7) | (b & 0x7f);
    if ((b & 0x80) === 0) return value;
  }
  throw new Error("MIDI variable-length value is too long");
}

function parseMidi(bytes, name) {

  }

      channel: ch,
      program: ch === PERCUSSION_CHANNEL ? null : 0,
      notes: [],
      bends: [],
      open: new Map(),
    });

  const tempos = [{ tick: 0, us: 500000 }];

  let denom = 4;

    if (pos + 8 > data.length || String.fromCharCode(data[pos], data[pos + 1], data[pos + 2], data[pos + 3]) !== "MTrk") {
      throw new Error(`${name || "MIDI"} is missing track ${trk + 1}`);

            stack.push({ tick, vel: d2 });
            line.open.set(d1, stack);

                start: on.tick,
                end: Math.max(tick, on.tick + 1),

                vel: on.vel,

    name: title,

    ppq: division,

    denom,

function usAtTick(song, tick) {
  let us = 500000;
  for (const tempo of song.tempos) {
    if (tempo.tick > tick) break;
    us = tempo.us;
  }
  return us;
}

function tickToFrame(song, tick) {
  let frame = 0;
  let last = 0;
  let us = 500000;
  const ppq = song.ppq;
  for (const tempo of song.tempos) {
    if (tempo.tick >= tick) break;
    frame += ((tempo.tick - last) / ppq) * (us / 1e6) * FRAME_HZ;
    last = tempo.tick;
    us = tempo.us;
  }
  frame += ((tick - last) / ppq) * (us / 1e6) * FRAME_HZ;
  return Math.max(0, Math.floor(frame + 1e-9));
}

function frameToTick(song, frame) {
  const us = usAtTick(song, 0);
  return Math.round((frame / FRAME_HZ) * (1e6 / us) * song.ppq);
}

function songFrames(song) {
  return Math.max(1, tickToFrame(song, song.maxTick));
}

function barTicks(song) {
  const quarters = song.numer * (4 / song.denom);
  return quarters * song.ppq;
}

function barCount(song) {
  const width = barTicks(song);
  return Math.max(1, Math.ceil(song.maxTick / width));
}

function bendSemis(line, tick) {
  let value = 0;
  for (const bend of line.bends) {
    if (bend.tick > tick) break;
    value = bend.value;
  }
  const semis = (value / 8192) * 2;
  if (Math.abs(semis) < 1) return 0;
  return Math.round(semis);
}

function suggestInstrument(instruments, program, percussion) {
  const keys = percussion
    ? ["SNARE-TIGHT", "SNARE-FUNKY", "HIHAT-SHORT", "BONGO", "CLAP-SNARE"]
    : familyKeys(program);
  for (const key of keys) {
    const hit = instruments.find((item) => item.id === key || item.id.startsWith(key));
    if (hit) return hit.id;
  }
  return instruments[0] ? instruments[0].id : null;

function familyKeys(program) {
  const p = program == null ? 0 : program;
  if (p <= 7) return ["PIANO", "MUSICBOX"];
  if (p <= 15) return ["BELL", "CELESTA", "MUSICBOX"];
  if (p <= 23) return ["ORGAN"];
  if (p <= 31) return ["GUITAR"];
  if (p <= 39) return ["BASS"];
  if (p <= 47) return ["VIOLIN", "STRING"];
  if (p <= 55) return ["STRING", "CHOIR"];
  if (p <= 63) return ["BRASS"];
  if (p <= 71) return ["SAX", "FLUTE", "OBOE"];
  if (p <= 79) return ["FLUTE"];
  if (p <= 87) return ["LEAD", "SAW", "SOLO"];
  if (p <= 95) return ["PAD"];
  return ["LEAD", "BELL"];
