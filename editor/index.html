function normalizeKit(src) {
  const kit = {};
  if (!src || typeof src !== "object") return kit;
  for (const [key, value] of Object.entries(src)) {
    const k = Number(key);
    if (!Number.isInteger(k) || k < 0 || k > 127 || !value || typeof value !== "object") continue;
    const entry = {};
    if (typeof value.instrument === "string" && value.instrument) entry.instrument = value.instrument;
    if (Number.isInteger(value.note) && value.note >= 0 && value.note <= 127) entry.note = value.note;
    if (Object.keys(entry).length) kit[k] = entry;
  }
  return kit;
}

function normalizeArrangement(song, saved, instruments) {
  const base = defaultArrangement(song, instruments);
  if (!saved || typeof saved !== "object") return base;
  const arrange = {
    title: typeof saved.title === "string" && saved.title.trim() ? saved.title.trim() : base.title,
    author: typeof saved.author === "string" ? saved.author : base.author,
    lines: {},
    voices: emptyVoices(),
  };
  for (let v = 1; v <= 3; v++) {
    const src = saved.voices && saved.voices[v];
    arrange.voices[v] = {
      instrument: src && src.instrument ? src.instrument : base.voices[v].instrument,
      arp: !!(src && src.arp),
      percussion: !!(src && src.percussion),
      kit: normalizeKit(src && src.kit),
    };
  }
  for (const line of song.lines) {
    const src = saved.lines && (saved.lines[line.channel] || saved.lines[String(line.channel)]);
    if (!src) {
      arrange.lines[line.channel] = base.lines[line.channel] || { mute: false, voice: 0 };
      continue;
    }
    const voice = src.voice >= 1 && src.voice <= 3 ? src.voice : 0;
    arrange.lines[line.channel] = { mute: !!src.mute, voice };
  }
  if (saved.voices) {
    for (let v = 1; v <= 3; v++) {
      const src = saved.voices[v] || saved.voices[String(v)];
      if (src && Object.prototype.hasOwnProperty.call(src, "percussion")) {
        arrange.voices[v].percussion = !!src.percussion;
      }
    }
  }
  return arrange;
}


// Build a PSID whose code+data load at $5000. genmusic.py relocates it,
// patches the single STA $D418, and rejects anything that would pass $8000.
// genmusic appends a 13-byte volume stub, so the body must end by $7FF2.

const SID_LOAD = 0x5000;
const SID_TOP = 0x8000;
const VOL_STUB = 13;
const MAX_BODY = SID_TOP - SID_LOAD - VOL_STUB;
const SW_NOTE_OFFSET = 11;
const KIT_MAX = 51;
// Gate-off frames before a re-struck note: SID-Wizard instruments hard
// restart for up to two frames.
const HR_FRAMES = 2;

function swNote(midiNote) {
  return Math.max(0, Math.min(95, midiNote - SW_NOTE_OFFSET));
}

function makeSawInstrument() {
  const raw = new Uint8Array(0x15);
  raw[0] = 0x1a;
  raw[1] = 0x0f;
  raw[3] = 0x09;
  raw[4] = 0xf8;
  raw[10] = 0x14;
  raw[11] = 0x15;
  raw[15] = 0x09;
  raw[16] = 0x21;
  raw[19] = 0xff;
  raw[20] = 0xff;
  return raw;
}

function makeNoiseInstrument() {
  const raw = makeSawInstrument();
  raw[3] = 0x0c;
  raw[4] = 0x00;
  raw[16] = 0x81;
  return raw;
}

function hexToBytes(hex) {
  const out = new Uint8Array(hex.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
  return out;
}

function bytesOf(list) {
  return Uint8Array.from(list);
}

function pushRest(out, frames) {
  let left = frames;
  while (left > 0) {
    const n = Math.min(127, left);
    out.push(n);
    left -= n;
  }
}

function pushPacked(out, note, gate, gap) {
  let left = Math.max(1, gate);
  const hole = Math.max(0, gap);
  if (left > 16 || hole > 15) {
    while (left > 0) {
      const chunk = Math.min(255, left);
      const last = chunk === left;
      out.push(0xf0, chunk, last ? Math.min(255, hole) : 0, note & 0x7f);
      left -= chunk;
      if (last && hole > 255) pushRest(out, hole - 255);
      if (last) return;
    }
  }
  out.push(0x80 | (note & 0x7f), ((left - 1) << 4) | hole);
}

function pushGap(out, frames) {
  let left = frames;
  while (left > 255) {
    out.push(0xfe, 255);
    left -= 255;
  }
  if (left > 0) out.push(0xfe, left);
}

function pushHit(out, slot, frames) {
  out.push(slot);
  let left = Math.max(1, frames);
  out.push(Math.min(255, left));
  left -= Math.min(255, left);
  while (left > 255) {
    out.push(0xfe, 255);
    left -= 255;
  }
  if (left > 0) out.push(0xfe, left);
}

function lineByChannel(song, channel) {
  return song.lines.find((line) => line.channel === channel);
}

function assignedNotes(song, arrange, voice) {
  const notes = [];
  for (const line of song.lines) {
    const row = arrange.lines[line.channel];
    if (!row || row.mute || row.voice !== voice) continue;
    for (const note of line.notes) {
      notes.push({
        line,
        channel: line.channel,
        start: tickToFrame(song, note.start),
        end: Math.max(tickToFrame(song, note.start) + 1, tickToFrame(song, note.end)),
        note: note.note,
        id: `${line.channel}:${note.start}:${note.note}`,
      });
    }
  }
  return notes;
}

function sounding(notes, frame) {
  const active = [];
  for (const note of notes) {
    if (note.start <= frame && frame < note.end) active.push(note);
  }
  return active;
}

function compileMelodic(song, notes, arp) {
  const total = songFrames(song);
  const segs = [];
  let run = null;
  const close = () => {
    if (!run) return;
    segs.push(run);
    run = null;
  };
  for (let frame = 0; frame < total; frame++) {
    const active = sounding(notes, frame);
    if (!active.length) {
      if (run && run.gate) close();
      if (!run) run = { gate: false, frames: 1 };
      else run.frames++;
      continue;
    }
    const chosen = arp ? active[Math.floor(frame / 2) % active.length] : active.reduce((a, b) => (a.note >= b.note ? a : b));
    const bend = bendSemis(chosen.line, frameToTick(song, frame));
    const sw = swNote(chosen.note + bend);
    if (run && run.gate && run.id === chosen.id && run.sw === sw) {
      run.frames++;
      continue;
    }
    const legato = !!(run && run.gate && run.id === chosen.id);
    close();
    run = { gate: true, frames: 1, sw, id: chosen.id, legato };
  }
  close();
  const out = [];
  for (let i = 0; i < segs.length; i++) {
    const seg = segs[i];
    if (!seg.gate) {
      pushRest(out, seg.frames);
      continue;
    }
    let gate = seg.frames;
    let gap = 0;
    const next = segs[i + 1];
    if (next && !next.gate) {
      gap = next.frames;
      next.frames = 0;
    } else if (next && next.gate && !next.legato && gate > 1) {
      gap = Math.min(HR_FRAMES, gate - 1);
      gate -= gap;
    }
    pushPacked(out, seg.sw, gate, gap);
  }
  out.push(0);
  return bytesOf(out);
}

// Kit entry for one drum key: the key's own instrument and pitch, or the
// voice instrument at the key's pitch.
function kitEntry(spec, key) {
  const kit = (spec && spec.kit) || {};
  const entry = kit[key] || {};
  return {
    instrument: entry.instrument || (spec && spec.instrument) || null,
    note: Number.isFinite(entry.note) ? entry.note : key,
  };
}

function drumKeys(notes) {
  return Array.from(new Set(notes.map((note) => note.note))).sort((a, b) => a - b);
}

function compilePercussion(song, notes, slotOf) {
  const total = songFrames(song);
  const hits = new Map();
  for (const note of notes) {
    hits.set(note.start, note);
  }
  const frames = Array.from(hits.keys()).sort((a, b) => a - b);
  const out = [];
  if (!frames.length) {
    out.push(0);
    return bytesOf(out);
  }
  if (frames[0] > 0) pushGap(out, frames[0]);
  for (let i = 0; i < frames.length; i++) {
    const hit = hits.get(frames[i]);
    const next = i + 1 < frames.length ? frames[i + 1] : total;
    const span = Math.max(1, next - frames[i]);
    const room = i + 1 < frames.length ? Math.max(1, span - HR_FRAMES) : span;
    const held = Math.max(1, Math.min(room, hit.end - hit.start));
    pushHit(out, slotOf(hit.note), held);
    if (span > held) pushGap(out, span - held);
  }
  out.push(0);
  return bytesOf(out);
}

function instrumentBytes(instruments, id, percussion) {
  const found = instruments.find((item) => item.id === id);
  if (found) return hexToBytes(found.raw);
  return percussion ? makeNoiseInstrument() : makeSawInstrument();
}

function writeAscii(buf, offset, text, len) {
  const src = (text || "").slice(0, len);
  for (let i = 0; i < len; i++) buf[offset + i] = i < src.length ? src.charCodeAt(i) & 0x7f : 0;
}

// Layout: player, kit table, one image per distinct instrument, streams.
function buildRamImage(song, arrange, instruments, playerBytes, labels) {
  const images = [];
  const imageAt = new Map();
  const useImage = (id, percussion) => {
    const key = (instruments.some((item) => item.id === id) ? id : null) || (percussion ? "#noise" : "#saw");
    if (!imageAt.has(key)) {
      imageAt.set(key, images.length);
      images.push({ key, raw: instrumentBytes(instruments, id, percussion) });
    }
    return imageAt.get(key);
  };
  const kit = [];
  const kitAt = new Map();
  const programs = [1, 2, 3].map((voice) => {
    const spec = arrange.voices[voice] || {};
    const notes = assignedNotes(song, arrange, voice);
    if (!notes.length) return { stream: bytesOf([0]), percussion: false, notes: 0, image: -1 };
    if (!spec.percussion) {
      return {
        stream: compileMelodic(song, notes, !!spec.arp),
        percussion: false,
        notes: notes.length,
        image: useImage(spec.instrument, false),
      };
    }
    const slots = new Map();
    for (const key of drumKeys(notes)) {
      const entry = kitEntry(spec, key);
      const image = useImage(entry.instrument, true);
      const sw = swNote(entry.note);
      const id = `${image}:${sw}`;
      if (!kitAt.has(id)) {
        kitAt.set(id, kit.length);
        kit.push({ image, sw });
      }
      slots.set(key, kitAt.get(id) + 1);
    }
    return {
      stream: compilePercussion(song, notes, (key) => slots.get(key)),
      percussion: true,
      notes: notes.length,
      image: kit[slots.values().next().value - 1].image,
    };
  });
  if (!images.length) useImage(null, false);
  for (const prog of programs) {
    if (prog.image < 0) prog.image = 0;
  }
  const player = playerBytes.length;
  const kitBytes = kit.length * 5;
  const insBytes = images.reduce((sum, img) => sum + img.raw.length, 0);
  const streamBytes = programs.map((prog) => prog.stream.length);
  const total = player + kitBytes + insBytes + streamBytes.reduce((a, b) => a + b, 0);
  const parts = {
    player,
    kit: kitBytes,
    kitSlots: kit.length,
    instruments: insBytes,
    voices: streamBytes,
    total,
    limit: MAX_BODY,
  };
  const body = new Uint8Array(total);
  body.set(playerBytes, 0);
  const kitStart = SID_LOAD + player;
  let cursor = player + kitBytes;
  const insAt = images.map((img) => {
    const at = cursor;
    body.set(img.raw, cursor);
    cursor += img.raw.length;
    return { start: SID_LOAD + at, end: SID_LOAD + cursor };
  });
  kit.forEach((slot, i) => {
    const ins = insAt[slot.image];
    body.set([slot.sw, ins.start & 0xff, ins.start >> 8, ins.end & 0xff, ins.end >> 8], player + i * 5);
  });
  const streamsAt = programs.map((prog) => {
    const at = cursor;
    body.set(prog.stream, cursor);
    cursor += prog.stream.length;
    return { start: SID_LOAD + at, end: SID_LOAD + cursor };
  });
  const off = (addr) => addr - SID_LOAD;
  for (let v = 0; v < 3; v++) {
    const ins = insAt[programs[v].image];
    body[off(labels.hdr_vptr_lo) + v] = streamsAt[v].start & 0xff;
    body[off(labels.hdr_vptr_hi) + v] = streamsAt[v].start >> 8;
    body[off(labels.hdr_vend_lo) + v] = streamsAt[v].end & 0xff;
    body[off(labels.hdr_vend_hi) + v] = streamsAt[v].end >> 8;
    body[off(labels.hdr_iptr_lo) + v] = ins.start & 0xff;
    body[off(labels.hdr_iptr_hi) + v] = ins.start >> 8;
    body[off(labels.hdr_iend_lo) + v] = ins.end & 0xff;
    body[off(labels.hdr_iend_hi) + v] = ins.end >> 8;
    body[off(labels.hdr_flags) + v] = programs[v].percussion ? 1 : 0;
  }
  body[off(labels.hdr_kit_lo)] = kitStart & 0xff;
  body[off(labels.hdr_kit_hi)] = kitStart >> 8;
  let stores = 0;
  for (let i = 0; i < body.length - 2; i++) {
    if (body[i] === 0x8d && body[i + 1] === 0x18 && body[i + 2] === 0xd4) stores++;
  }
  return { body, parts, programs, images, stores };
}

function buildSid(song, arrange, instruments, playerBytes, labels) {
  const image = buildRamImage(song, arrange, instruments, playerBytes, labels);
  const { body, parts, programs, images, stores } = image;
  if (parts.total > MAX_BODY) {
    return {
      ok: false,
      error: `SID is ${parts.total} bytes and the menu allows ${MAX_BODY}. Mute a line or turn arpeggio off.`,
      parts,
    };
  }
  if (parts.kitSlots > KIT_MAX) {
    return { ok: false, error: `Drum kit has ${parts.kitSlots} sounds; the player takes ${KIT_MAX}.`, parts };
  }
  if (stores !== 1) {
    return { ok: false, error: `player has ${stores} STA $D418 instructions`, parts, body };
  }
  const psid = new Uint8Array(0x7c + body.length);
  psid.set([0x50, 0x53, 0x49, 0x44, 0x00, 0x02, 0x00, 0x7c]);
  psid[8] = SID_LOAD >> 8;
  psid[9] = SID_LOAD & 0xff;
  psid[10] = SID_LOAD >> 8;
  psid[11] = SID_LOAD & 0xff;
  psid[12] = (SID_LOAD + 3) >> 8;
  psid[13] = (SID_LOAD + 3) & 0xff;
  psid[15] = 1;
  psid[17] = 1;
  writeAscii(psid, 0x16, arrange.title || song.name, 32);
  writeAscii(psid, 0x36, arrange.author || "", 32);
  writeAscii(psid, 0x56, "2026 Wolf64", 32);
  psid[0x77] = 0x24;
  psid.set(body, 0x7c);
  return { ok: true, bytes: psid, body, parts, programs, images };
}


// Enough of a 6510 to run editor/player.bin. RAM is a flat 64K.
// Writes to $D400–$D418 are also reported to the SID chip.

class CPU6502 {
  constructor() {
    this.mem = new Uint8Array(65536);
    this.a = 0;
    this.x = 0;
    this.y = 0;
    this.sp = 0xff;
    this.pc = 0;
    this.p = 0x20;
    this.sidWrite = null;
    this.sidRead = null;
  }

  reset() {
    this.a = this.x = this.y = 0;
    this.sp = 0xff;
    this.p = 0x20;
    this.pc = 0;
  }

  zn(v) {
    this.p = (this.p & ~0x82) | (v & 0x80) | (v === 0 ? 2 : 0);
  }

  push(v) {
    this.mem[0x100 + this.sp] = v;
    this.sp = (this.sp - 1) & 255;
  }

  pop() {
    this.sp = (this.sp + 1) & 255;
    return this.mem[0x100 + this.sp];
  }

  read(addr) {
    addr &= 0xffff;
    if (addr === 0xd41b && this.sidRead) return this.sidRead(addr);
    return this.mem[addr];
  }

  write(addr, val) {
    addr &= 0xffff;
    val &= 255;
    this.mem[addr] = val;
    if (addr >= 0xd400 && addr <= 0xd418 && this.sidWrite) this.sidWrite(addr & 0x1f, val);
  }

  wordAt(pc) {
    return this.mem[pc] | (this.mem[(pc + 1) & 0xffff] << 8);
  }

  fetchWord() {
    const w = this.wordAt(this.pc);
    this.pc = (this.pc + 2) & 0xffff;
    return w;
  }

  zpAddr(index) {
    return (this.mem[this.pc++] + index) & 255;
  }

  absAddr(index) {
    return (this.fetchWord() + index) & 0xffff;
  }

  indYAddr() {
    const zp = this.mem[this.pc++];
    const base = this.mem[zp] | (this.mem[(zp + 1) & 255] << 8);
    return (base + this.y) & 0xffff;
  }

  indXAddr() {
    const zp = (this.mem[this.pc++] + this.x) & 255;
    return this.mem[zp] | (this.mem[(zp + 1) & 255] << 8);
  }

  setC(on) {
    this.p = (this.p & ~1) | (on ? 1 : 0);
  }

  adc(v) {
    const a = this.a;
    let sum = a + v + (this.p & 1);
    this.setC(sum > 255);
    sum &= 255;
    if (~(a ^ v) & (a ^ sum) & 0x80) this.p |= 0x40;
    else this.p &= ~0x40;
    this.a = sum;
    this.zn(sum);
  }

  sbc(v) {
    this.adc(v ^ 0xff);
  }

  cmp(reg, v) {
    const r = (reg - v) & 0xffff;
    this.setC(reg >= v);
    this.zn(r & 255);
  }

  branch(cond) {
    const off = this.mem[this.pc++];
    if (!cond) return;
    const rel = off < 128 ? off : off - 256;
    this.pc = (this.pc + rel) & 0xffff;
  }

  asl(v) {
    this.setC(v & 0x80);
    const r = (v << 1) & 255;
    this.zn(r);
    return r;
  }

  lsr(v) {
    this.setC(v & 1);
    const r = v >> 1;
    this.zn(r);
    return r;
  }

  rol(v) {
    const r = ((v << 1) | (this.p & 1)) & 255;
    this.setC(v & 0x80);
    this.zn(r);
    return r;
  }

  ror(v) {
    const r = (v >> 1) | ((this.p & 1) << 7);
    this.setC(v & 1);
    this.zn(r);
    return r;
  }

  rmw(addr, fn) {
    const r = fn.call(this, this.read(addr));
    this.write(addr, r);
  }

  step() {
    const op = this.mem[this.pc++];
    switch (op) {
      case 0x00: this.pc = (this.pc + 1) & 0xffff; break;
      case 0x01: { const a = this.indXAddr(); this.a |= this.read(a); this.zn(this.a); break; }
      case 0x05: { const a = this.zpAddr(0); this.a |= this.read(a); this.zn(this.a); break; }
      case 0x06: { const a = this.zpAddr(0); this.rmw(a, this.asl); break; }
      case 0x08: this.push(this.p | 0x30); break;
      case 0x09: this.a |= this.mem[this.pc++]; this.zn(this.a); break;
      case 0x0a: this.a = this.asl(this.a); break;
      case 0x0d: { const a = this.absAddr(0); this.a |= this.read(a); this.zn(this.a); break; }
      case 0x0e: { const a = this.absAddr(0); this.rmw(a, this.asl); break; }

      case 0x10: this.branch((this.p & 0x80) === 0); break;
      case 0x11: { const a = this.indYAddr(); this.a |= this.read(a); this.zn(this.a); break; }
      case 0x15: { const a = this.zpAddr(this.x); this.a |= this.read(a); this.zn(this.a); break; }
      case 0x16: { const a = this.zpAddr(this.x); this.rmw(a, this.asl); break; }
      case 0x18: this.setC(false); break;
      case 0x19: { const a = this.absAddr(this.y); this.a |= this.read(a); this.zn(this.a); break; }
      case 0x1d: { const a = this.absAddr(this.x); this.a |= this.read(a); this.zn(this.a); break; }
      case 0x1e: { const a = this.absAddr(this.x); this.rmw(a, this.asl); break; }

      case 0x20: {
        const addr = this.fetchWord();
        const ret = (this.pc - 1) & 0xffff;
        this.push(ret >> 8);
        this.push(ret & 255);
        this.pc = addr;
        break;
      }
      case 0x21: { const a = this.indXAddr(); this.a &= this.read(a); this.zn(this.a); break; }
      case 0x24: { const v = this.read(this.zpAddr(0)); this.p = (this.p & ~0xc2) | (v & 0xc0) | ((this.a & v) === 0 ? 2 : 0); break; }
      case 0x25: { const a = this.zpAddr(0); this.a &= this.read(a); this.zn(this.a); break; }
      case 0x26: { const a = this.zpAddr(0); this.rmw(a, this.rol); break; }
      case 0x28: this.p = (this.pop() & ~0x10) | 0x20; break;
      case 0x29: this.a &= this.mem[this.pc++]; this.zn(this.a); break;
      case 0x2a: this.a = this.rol(this.a); break;
      case 0x2c: { const v = this.read(this.absAddr(0)); this.p = (this.p & ~0xc2) | (v & 0xc0) | ((this.a & v) === 0 ? 2 : 0); break; }
      case 0x2d: { const a = this.absAddr(0); this.a &= this.read(a); this.zn(this.a); break; }
      case 0x2e: { const a = this.absAddr(0); this.rmw(a, this.rol); break; }

      case 0x30: this.branch((this.p & 0x80) !== 0); break;
      case 0x31: { const a = this.indYAddr(); this.a &= this.read(a); this.zn(this.a); break; }
      case 0x35: { const a = this.zpAddr(this.x); this.a &= this.read(a); this.zn(this.a); break; }
      case 0x36: { const a = this.zpAddr(this.x); this.rmw(a, this.rol); break; }
      case 0x38: this.setC(true); break;
      case 0x39: { const a = this.absAddr(this.y); this.a &= this.read(a); this.zn(this.a); break; }
      case 0x3d: { const a = this.absAddr(this.x); this.a &= this.read(a); this.zn(this.a); break; }
      case 0x3e: { const a = this.absAddr(this.x); this.rmw(a, this.rol); break; }

      case 0x40: {
        this.p = (this.pop() & ~0x10) | 0x20;
        const lo = this.pop();
        const hi = this.pop();
        this.pc = (hi << 8) | lo;
        break;
      }
      case 0x41: { const a = this.indXAddr(); this.a ^= this.read(a); this.zn(this.a); break; }
      case 0x45: { const a = this.zpAddr(0); this.a ^= this.read(a); this.zn(this.a); break; }
      case 0x46: { const a = this.zpAddr(0); this.rmw(a, this.lsr); break; }
      case 0x48: this.push(this.a); break;
      case 0x49: this.a ^= this.mem[this.pc++]; this.zn(this.a); break;
      case 0x4a: this.a = this.lsr(this.a); break;
      case 0x4c: this.pc = this.fetchWord(); break;
      case 0x4d: { const a = this.absAddr(0); this.a ^= this.read(a); this.zn(this.a); break; }
      case 0x4e: { const a = this.absAddr(0); this.rmw(a, this.lsr); break; }

      case 0x50: this.branch((this.p & 0x40) === 0); break;
      case 0x51: { const a = this.indYAddr(); this.a ^= this.read(a); this.zn(this.a); break; }
      case 0x55: { const a = this.zpAddr(this.x); this.a ^= this.read(a); this.zn(this.a); break; }
      case 0x56: { const a = this.zpAddr(this.x); this.rmw(a, this.lsr); break; }
      case 0x58: this.p &= ~0x04; break;
      case 0x59: { const a = this.absAddr(this.y); this.a ^= this.read(a); this.zn(this.a); break; }
      case 0x5d: { const a = this.absAddr(this.x); this.a ^= this.read(a); this.zn(this.a); break; }
      case 0x5e: { const a = this.absAddr(this.x); this.rmw(a, this.lsr); break; }

      case 0x60: {
        const lo = this.pop();
        const hi = this.pop();
        this.pc = ((hi << 8) | lo) + 1;
        this.pc &= 0xffff;
        break;
      }
      case 0x61: { const a = this.indXAddr(); this.adc(this.read(a)); break; }
      case 0x65: { const a = this.zpAddr(0); this.adc(this.read(a)); break; }
      case 0x66: { const a = this.zpAddr(0); this.rmw(a, this.ror); break; }
      case 0x68: this.a = this.pop(); this.zn(this.a); break;
      case 0x69: this.adc(this.mem[this.pc++]); break;
      case 0x6a: this.a = this.ror(this.a); break;
      case 0x6c: {
        const ptr = this.fetchWord();
        const lo = this.mem[ptr];
        const hiAddr = (ptr & 0xff) === 0xff ? ptr & 0xff00 : ptr + 1;
        const hi = this.mem[hiAddr];
        this.pc = (hi << 8) | lo;
        break;
      }
      case 0x6d: { const a = this.absAddr(0); this.adc(this.read(a)); break; }
      case 0x6e: { const a = this.absAddr(0); this.rmw(a, this.ror); break; }

      case 0x70: this.branch((this.p & 0x40) !== 0); break;
      case 0x71: { const a = this.indYAddr(); this.adc(this.read(a)); break; }
      case 0x75: { const a = this.zpAddr(this.x); this.adc(this.read(a)); break; }
      case 0x76: { const a = this.zpAddr(this.x); this.rmw(a, this.ror); break; }
      case 0x78: this.p |= 0x04; break;
      case 0x79: { const a = this.absAddr(this.y); this.adc(this.read(a)); break; }
      case 0x7d: { const a = this.absAddr(this.x); this.adc(this.read(a)); break; }
      case 0x7e: { const a = this.absAddr(this.x); this.rmw(a, this.ror); break; }

      case 0x81: this.write(this.indXAddr(), this.a); break;
      case 0x84: this.write(this.zpAddr(0), this.y); break;
      case 0x85: this.write(this.zpAddr(0), this.a); break;
      case 0x86: this.write(this.zpAddr(0), this.x); break;
      case 0x88: this.y = (this.y - 1) & 255; this.zn(this.y); break;
      case 0x8a: this.a = this.x; this.zn(this.a); break;
      case 0x8c: this.write(this.absAddr(0), this.y); break;
      case 0x8d: this.write(this.absAddr(0), this.a); break;
      case 0x8e: this.write(this.absAddr(0), this.x); break;

      case 0x90: this.branch((this.p & 1) === 0); break;
      case 0x91: this.write(this.indYAddr(), this.a); break;
      case 0x94: this.write(this.zpAddr(this.x), this.y); break;
      case 0x95: this.write(this.zpAddr(this.x), this.a); break;
      case 0x96: this.write(this.zpAddr(this.y), this.x); break;
      case 0x98: this.a = this.y; this.zn(this.a); break;
      case 0x99: this.write(this.absAddr(this.y), this.a); break;
      case 0x9a: this.sp = this.x; break;
      case 0x9d: this.write(this.absAddr(this.x), this.a); break;

      case 0xa0: this.y = this.mem[this.pc++]; this.zn(this.y); break;
      case 0xa1: this.a = this.read(this.indXAddr()); this.zn(this.a); break;
      case 0xa2: this.x = this.mem[this.pc++]; this.zn(this.x); break;
      case 0xa4: this.y = this.read(this.zpAddr(0)); this.zn(this.y); break;
      case 0xa5: this.a = this.read(this.zpAddr(0)); this.zn(this.a); break;
      case 0xa6: this.x = this.read(this.zpAddr(0)); this.zn(this.x); break;
      case 0xa8: this.y = this.a; this.zn(this.y); break;
      case 0xa9: this.a = this.mem[this.pc++]; this.zn(this.a); break;
      case 0xaa: this.x = this.a; this.zn(this.x); break;
      case 0xac: this.y = this.read(this.absAddr(0)); this.zn(this.y); break;
      case 0xad: this.a = this.read(this.absAddr(0)); this.zn(this.a); break;
      case 0xae: this.x = this.read(this.absAddr(0)); this.zn(this.x); break;

      case 0xb0: this.branch((this.p & 1) !== 0); break;
      case 0xb1: this.a = this.read(this.indYAddr()); this.zn(this.a); break;
      case 0xb4: this.y = this.read(this.zpAddr(this.x)); this.zn(this.y); break;
      case 0xb5: this.a = this.read(this.zpAddr(this.x)); this.zn(this.a); break;
      case 0xb6: this.x = this.read(this.zpAddr(this.y)); this.zn(this.x); break;
      case 0xb8: this.p &= ~0x40; break;
      case 0xb9: this.a = this.read(this.absAddr(this.y)); this.zn(this.a); break;
      case 0xba: this.x = this.sp; this.zn(this.x); break;
      case 0xbc: this.y = this.read(this.absAddr(this.x)); this.zn(this.y); break;
      case 0xbd: this.a = this.read(this.absAddr(this.x)); this.zn(this.a); break;
      case 0xbe: this.x = this.read(this.absAddr(this.y)); this.zn(this.x); break;

      case 0xc0: this.cmp(this.y, this.mem[this.pc++]); break;
      case 0xc1: this.cmp(this.a, this.read(this.indXAddr())); break;
      case 0xc4: this.cmp(this.y, this.read(this.zpAddr(0))); break;
      case 0xc5: this.cmp(this.a, this.read(this.zpAddr(0))); break;
      case 0xc6: { const a = this.zpAddr(0); this.write(a, (this.read(a) - 1) & 255); this.zn(this.mem[a]); break; }
      case 0xc8: this.y = (this.y + 1) & 255; this.zn(this.y); break;
      case 0xc9: this.cmp(this.a, this.mem[this.pc++]); break;
      case 0xca: this.x = (this.x - 1) & 255; this.zn(this.x); break;
      case 0xcc: this.cmp(this.y, this.read(this.absAddr(0))); break;
      case 0xcd: this.cmp(this.a, this.read(this.absAddr(0))); break;
      case 0xce: { const a = this.absAddr(0); this.write(a, (this.read(a) - 1) & 255); this.zn(this.mem[a]); break; }

      case 0xd0: this.branch((this.p & 2) === 0); break;
      case 0xd1: this.cmp(this.a, this.read(this.indYAddr())); break;
      case 0xd5: this.cmp(this.a, this.read(this.zpAddr(this.x))); break;
      case 0xd6: { const a = this.zpAddr(this.x); this.write(a, (this.read(a) - 1) & 255); this.zn(this.mem[a]); break; }
      case 0xd8: this.p &= ~0x08; break;
      case 0xd9: this.cmp(this.a, this.read(this.absAddr(this.y))); break;
      case 0xdd: this.cmp(this.a, this.read(this.absAddr(this.x))); break;
      case 0xde: { const a = this.absAddr(this.x); this.write(a, (this.read(a) - 1) & 255); this.zn(this.mem[a]); break; }

      case 0xe0: this.cmp(this.x, this.mem[this.pc++]); break;
      case 0xe1: this.sbc(this.read(this.indXAddr())); break;
      case 0xe4: this.cmp(this.x, this.read(this.zpAddr(0))); break;
      case 0xe5: this.sbc(this.read(this.zpAddr(0))); break;
      case 0xe6: { const a = this.zpAddr(0); this.write(a, (this.read(a) + 1) & 255); this.zn(this.mem[a]); break; }
      case 0xe8: this.x = (this.x + 1) & 255; this.zn(this.x); break;
      case 0xe9: this.sbc(this.mem[this.pc++]); break;
      case 0xea: break;
      case 0xec: this.cmp(this.x, this.read(this.absAddr(0))); break;
      case 0xed: this.sbc(this.read(this.absAddr(0))); break;
      case 0xee: { const a = this.absAddr(0); this.write(a, (this.read(a) + 1) & 255); this.zn(this.mem[a]); break; }

      case 0xf0: this.branch((this.p & 2) !== 0); break;
      case 0xf1: this.sbc(this.read(this.indYAddr())); break;
      case 0xf5: this.sbc(this.read(this.zpAddr(this.x))); break;
      case 0xf6: { const a = this.zpAddr(this.x); this.write(a, (this.read(a) + 1) & 255); this.zn(this.mem[a]); break; }
      case 0xf8: this.p |= 0x08; break;
      case 0xf9: this.sbc(this.read(this.absAddr(this.y))); break;
      case 0xfd: this.sbc(this.read(this.absAddr(this.x))); break;
      case 0xfe: { const a = this.absAddr(this.x); this.write(a, (this.read(a) + 1) & 255); this.zn(this.mem[a]); break; }

      default:
        throw new Error("unknown opcode $" + op.toString(16) + " at $" + ((this.pc - 1) & 0xffff).toString(16));
    }
  }

  // Run addr until RTS back to the caller. The player's init and play both RTS.
  call(addr) {
    this.push(0x7f);
    this.push(0xff);
    this.pc = addr & 0xffff;
    let n = 0;
    while (this.pc !== 0x8000) {
      this.step();
      if (++n > 250000) {
        throw new Error("player ran too long at $" + this.pc.toString(16));
      }
    }
  }
}


// PAL SID model with the 8580 filter curve the SID-Wizard presets were tuned
// on. Pulse width, the exponential envelope, and the filter are what make two
// patches sound different.

const SID_CLOCK = 985248;
const OVERSAMPLE = 4;
const OUTPUT_GAIN = 0.3;
const ENV_PERIOD = [
  8, 31, 63, 95, 149, 220, 267, 313, 392, 977,
  1954, 3126, 3906, 11720, 19531, 31251,
];

function envMul(level) {
  if (level < 0x06) return 30;
  if (level < 0x0e) return 16;
  if (level < 0x1a) return 8;
  if (level < 0x36) return 4;
  if (level < 0x5d) return 2;
  return 1;
}

// The chip's 8 noise output taps, as waveform bits 11-4.
function noiseBits(l) {
  return (((l >> 20) & 1) << 11) | (((l >> 18) & 1) << 10) | (((l >> 14) & 1) << 9) |
    (((l >> 11) & 1) << 8) | (((l >> 9) & 1) << 7) | (((l >> 5) & 1) << 6) |
    (((l >> 2) & 1) << 5) | ((l & 1) << 4);
}

class SidVoice {
  constructor() {
    this.freq = 0;
    this.pw = 0x800;
    this.ctrl = 0;
    this.attack = 0;
    this.decay = 0;
    this.sustain = 0;
    this.release = 0;
    this.acc = 0;
    this.lfsr = 0x7ffff8;
    this.noise = noiseBits(this.lfsr);
    this.env = 0;
    this.phase = "rel";
    this.envTimer = 1;
    this.gate = false;
  }
}

class SidChip {
  constructor(sampleRate) {
    this.sampleRate = sampleRate || 44100;
    this.cyclesPerSample = SID_CLOCK / this.sampleRate;
    this.voices = [new SidVoice(), new SidVoice(), new SidVoice()];
    this.cut = 0;
    this.res = 0;
    this.mode = 0;
    this.vol = 15;
    this.routed = 0;
    this.low = 0;
    this.band = 0;
    this.high = 0;
    this.cycleFrac = 0;
    this.lp = 0;
    this.hp = 0;
    this.lpCoef = 1 - Math.exp(-2 * Math.PI * 16000 / (this.sampleRate * OVERSAMPLE));
    this.hpCoef = 1 - Math.exp(-2 * Math.PI * 16 / this.sampleRate);
  }

  reset() {
    this.voices = [new SidVoice(), new SidVoice(), new SidVoice()];
    this.cut = 0;
    this.res = 0;
    this.mode = 0;
    this.vol = 15;
    this.routed = 0;
    this.low = this.band = this.high = 0;
    this.lp = this.hp = 0;
    this.cycleFrac = 0;
  }

  write(reg, val) {
    const v = reg < 21 ? this.voices[(reg / 7) | 0] : null;
    const r = reg < 21 ? reg % 7 : reg;
    if (r === 0 && v) v.freq = (v.freq & 0xff00) | val;
    else if (r === 1 && v) v.freq = (v.freq & 0x00ff) | (val << 8);
    else if (r === 2 && v) v.pw = (v.pw & 0x0f00) | val;
    else if (r === 3 && v) v.pw = (v.pw & 0x00ff) | ((val & 0x0f) << 8);
    else if (r === 4 && v) this.setCtrl(v, val);
    else if (r === 5 && v) {
      v.attack = val >> 4;
      v.decay = val & 15;
    } else if (r === 6 && v) {
      v.sustain = val >> 4;
      v.release = val & 15;
    } else if (reg === 21) this.cut = (this.cut & 0x7f8) | (val & 7);
    else if (reg === 22) this.cut = (this.cut & 7) | (val << 3);
    else if (reg === 23) {
      this.res = val >> 4;
      this.routed = val & 7;
    } else if (reg === 24) {
      this.mode = val & 0x70;
      this.vol = val & 15;
    }
  }

  setCtrl(voice, val) {
    const gate = (val & 1) !== 0;
    if (gate && !voice.gate) {
      voice.phase = "atk";
      voice.envTimer = this.period(voice, false);
    } else if (!gate && voice.gate) {
      voice.phase = "rel";
      voice.envTimer = this.period(voice, true);
    }
    voice.gate = gate;
    voice.ctrl = val;
    if (val & 0x08) {
      voice.acc = 0;
      voice.lfsr = 0x7ffff8;
      voice.noise = noiseBits(voice.lfsr);
    }
  }

  period(voice, releasing) {
    const rate = voice.phase === "atk" ? voice.attack : (releasing || voice.phase === "rel" ? voice.release : voice.decay);
    const mul = voice.phase === "atk" ? 1 : envMul(voice.env);
    return Math.max(1, ENV_PERIOD[rate] * mul);
  }

  sustainLevel(voice) {
    const n = voice.sustain;
    return (n << 4) | n;
  }

  advanceEnv(cycles) {
    for (const voice of this.voices) {
      let left = cycles;
      while (left > 0) {
        if (voice.phase === "sus") break;
        if (voice.phase === "dec" && voice.env <= this.sustainLevel(voice)) {
          voice.phase = "sus";
          voice.env = this.sustainLevel(voice);
          break;
        }
        if ((voice.phase === "dec" || voice.phase === "rel") && voice.env <= 0) {
          voice.env = 0;
          break;
        }
        if (voice.envTimer > left) {
          voice.envTimer -= left;
          break;
        }
        left -= voice.envTimer;
        if (voice.phase === "atk") {
          voice.env = Math.min(255, voice.env + 1);
          if (voice.env >= 255) voice.phase = "dec";
        } else {
          voice.env = Math.max(0, voice.env - 1);
        }
        voice.envTimer = this.period(voice, voice.phase === "rel");
      }
    }
  }

  advanceOsc(cycles) {
    for (const voice of this.voices) {
      if (voice.ctrl & 0x08) {
        voice.acc = 0;
        continue;
      }
      const prev = voice.acc;
      const delta = voice.freq * cycles;
      voice.acc = (voice.acc + delta) & 0xffffff;
      // The LFSR steps on each rising edge of accumulator bit 19.
      const clocks = Math.floor((prev + delta + 0x80000) / 0x100000) - Math.floor((prev + 0x80000) / 0x100000);
      if (!clocks) continue;
      let lfsr = voice.lfsr;
      for (let i = 0; i < clocks; i++) {
        const bit = ((lfsr >> 22) ^ (lfsr >> 17)) & 1;
        lfsr = ((lfsr << 1) | bit) & 0x7fffff;
      }
      voice.lfsr = lfsr || 1;
      voice.noise = noiseBits(voice.lfsr);
    }
  }

  clock(cycles) {
    if (cycles <= 0) return;
    this.advanceEnv(cycles);
    this.advanceOsc(cycles);
  }

  wave(voice) {
    if (voice.ctrl & 0x08) return 0;
    const saw = voice.acc >>> 12;
    let tri = (voice.acc >>> 11) & 0xfff;
    if (voice.acc & 0x800000) tri ^= 0xfff;
    const pulse = saw >= voice.pw ? 0xfff : 0;
    const noise = voice.noise;
    const ctrl = voice.ctrl;
    let bits = 0xfff;
    let any = false;
    if (ctrl & 0x10) { bits &= tri; any = true; }
    if (ctrl & 0x20) { bits &= saw; any = true; }
    if (ctrl & 0x40) { bits &= pulse; any = true; }
    if (ctrl & 0x80) { bits &= noise; any = true; }
    if (!any) return 0;
    return (bits - 0x800) / 0x800;
  }

  output() {
    let dry = 0;
    let wet = 0;
    for (let i = 0; i < 3; i++) {
      const voice = this.voices[i];
      const sample = this.wave(voice) * (voice.env / 255);
      if (this.routed & (1 << i)) wet += sample;
      else dry += sample;
    }
    const f = this.filterCoef();
    const damp = 1 / (0.707 + this.res / 15 * 1.5);
    this.low += f * this.band;
    this.high = wet - this.low - damp * this.band;
    this.band += f * this.high;
    let shaped = 0;
    if (this.mode & 0x10) shaped += this.low;
    if (this.mode & 0x20) shaped += this.band;
    if (this.mode & 0x40) shaped += this.high;
    const mixed = (dry + shaped) * (this.vol / 15);
    this.lp += this.lpCoef * (mixed - this.lp);
    return this.lp;
  }

  filterCoef() {
    if (this.coefCut === this.cut) return this.coef;
    const fs = this.sampleRate * OVERSAMPLE;
    const hz = 30 + this.cut * 5.8;
    this.coefCut = this.cut;
    this.coef = 2 * Math.sin(Math.PI * Math.min(hz, 0.2 * fs) / fs);
    return this.coef;
  }

  // The chip is stepped OVERSAMPLE times per output sample and averaged, then
  // goes through the C64's output stage: ~16 kHz lowpass, ~16 Hz DC block.
  render(out, offset, length) {
    const step = this.cyclesPerSample / OVERSAMPLE;
    for (let i = 0; i < length; i++) {
      let sum = 0;
      for (let s = 0; s < OVERSAMPLE; s++) {
        this.cycleFrac += step;
        const whole = this.cycleFrac | 0;
        this.cycleFrac -= whole;
        this.clock(whole);
        sum += this.output();
      }
      const x = sum / OVERSAMPLE;
      this.hp += this.hpCoef * (x - this.hp);
      out[offset + i] = Math.tanh((x - this.hp) * OUTPUT_GAIN);
    }
  }

  skip(samples) {
    const cycles = this.cyclesPerSample * samples;
    this.clock(cycles);
  }
}


// Runs editor/player.bin and clocks a SID chip from the registers it writes.
// The image is the same bytes the menu loads at SID_LOAD.

const SID_INIT = SID_LOAD;
const SID_PLAY = SID_LOAD + 3;

class SidMachine {
  constructor(sampleRate) {
    this.cpu = new CPU6502();
    this.sid = new SidChip(sampleRate);
    this.cpu.sidWrite = (reg, val) => this.sid.write(reg, val);
    // SidChip models the 8580 filter, so the player's chip check must see one.
    this.cpu.sidRead = () => 0xff;
    this.sampleRate = this.sid.sampleRate;
    this.samplesPerFrame = this.sampleRate / 50;
    this.sampleDebt = 0;
    this.frame = 0;
  }

  load(image) {
    this.cpu.mem.fill(0);
    this.cpu.mem.set(image, SID_LOAD);
    this.cpu.reset();
    this.sid.reset();
    this.cpu.call(SID_INIT);
    this.frame = 0;
    this.sampleDebt = 0;
  }

  playFrame() {
    this.cpu.call(SID_PLAY);
    this.frame++;
  }

  seek(frames) {
    for (let i = 0; i < frames; i++) {
      this.playFrame();
      this.sid.skip(this.samplesPerFrame);
    }
  }

  fill(out) {
    let i = 0;
    while (i < out.length) {
      if (this.sampleDebt <= 0) {
        this.playFrame();
        this.sampleDebt += this.samplesPerFrame;
      }
      const n = Math.min(out.length - i, Math.ceil(this.sampleDebt));
      this.sid.render(out, i, n);
      this.sampleDebt -= n;
      i += n;
    }
  }
}


// Proportional staves. Time runs left to right; barlines are 4/4 unless the
// MIDI file says otherwise. Percussion uses cross noteheads.

const SCORE = {
  pxPerBeat: 56,
  rowH: 92,
  space: 7,
  left: 28,
  right: 36,
  top: 22,
};

const STEP_NAME = [0, 0, 1, 1, 2, 3, 3, 4, 4, 5, 5, 6];
const IS_SHARP = [0, 1, 0, 1, 0, 0, 1, 0, 1, 0, 1, 0];

function diatonic(note) {
  const oct = Math.floor(note / 12);
  return oct * 7 + STEP_NAME[((note % 12) + 12) % 12];
}

function clefFor(line) {
  if (line.channel === PERCUSSION_CHANNEL) return "perc";
  const notes = line.notes.map((note) => note.note).sort((a, b) => a - b);
  const mid = notes[Math.floor(notes.length / 2)] || 60;
  return mid >= 60 ? "treble" : "bass";
}

function middleDiatonic(clef) {
  if (clef === "bass") return diatonic(50);
  return diatonic(71);
}

function scoreWidth(song) {
  const beats = song.maxTick / song.ppq;
  return Math.ceil(SCORE.left + beats * SCORE.pxPerBeat + SCORE.right);
}

function scoreHeight(song) {
  return song.lines.length * SCORE.rowH + 8;
}

function tickX(song, tick) {
  return SCORE.left + (tick / song.ppq) * SCORE.pxPerBeat;
}

function xToTick(song, x) {
  const tick = ((x - SCORE.left) / SCORE.pxPerBeat) * song.ppq;
  return Math.max(0, Math.min(song.maxTick, tick));
}

function drawClef(ctx, clef, x, midY) {
  ctx.save();
  ctx.fillStyle = "#d4a017";
  ctx.font = "28px 'Segoe UI', serif";
  ctx.textBaseline = "middle";
  if (clef === "treble") ctx.fillText("𝄞", x, midY + 4);
  else if (clef === "bass") ctx.fillText("𝄢", x, midY - 2);
  else {
    ctx.font = "bold 16px 'Segoe UI', sans-serif";
    ctx.fillText("perc", x, midY);
  }
  ctx.restore();
}

function drawScore(canvas, song, arrange, selected) {
  const pane = document.getElementById("score-scroll");
  const width = Math.max(scoreWidth(song), pane ? pane.clientWidth : 0);
  const height = scoreHeight(song);
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.floor(width * dpr);
  canvas.height = Math.floor(height * dpr);
  canvas.style.width = `${width}px`;
  canvas.style.height = `${height}px`;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = "#0e1016";
  ctx.fillRect(0, 0, width, height);

  const bars = barTicks(song);
  song.lines.forEach((line, index) => {
    const row = arrange.lines[line.channel] || { mute: false, voice: 0 };
    const top = index * SCORE.rowH;
    const midY = top + SCORE.rowH / 2 + 4;
    const clef = clefFor(line);
    const middle = middleDiatonic(clef);
    ctx.save();
    ctx.globalAlpha = row.mute ? 0.35 : 1;
    if (selected === line.channel) {
      ctx.fillStyle = "rgba(212, 160, 23, 0.08)";
      ctx.fillRect(0, top + 4, width, SCORE.rowH - 8);
    }
    ctx.strokeStyle = "#2e3340";
    ctx.lineWidth = 1;
    for (let i = -2; i <= 2; i++) {
      const y = midY - i * SCORE.space;
      ctx.beginPath();
      ctx.moveTo(SCORE.left - 8, y);
      ctx.lineTo(width - 8, y);
      ctx.stroke();
    }
    drawClef(ctx, clef, 2, midY);
    ctx.fillStyle = row.voice ? "#d4a017" : "#8b91a0";
    ctx.font = "11px 'Segoe UI', sans-serif";
    ctx.textBaseline = "top";
    ctx.fillText(row.voice ? `V${row.voice}` : "—", 4, top + 6);

    ctx.strokeStyle = "#3a4258";
    ctx.fillStyle = "#8b91a0";
    ctx.font = "11px 'Segoe UI', sans-serif";
    ctx.textBaseline = "alphabetic";
    for (let bar = 0, tick = 0; tick <= song.maxTick + bars; bar++, tick += bars) {
      const x = tickX(song, tick);
      ctx.beginPath();
      ctx.moveTo(x, midY - 2 * SCORE.space);
      ctx.lineTo(x, midY + 2 * SCORE.space);
      ctx.stroke();
      if (index === 0) {
        ctx.fillText(String(bar + 1), x + 4, top + 14);
      }
    }

    const yFor = (midi) => midY - (diatonic(midi) - middle) * (SCORE.space / 2);
    for (const note of line.notes) {
      const x = tickX(song, note.start);
      const step = diatonic(note.note) - middle;
      const y = yFor(note.note);
      const evenLimit = step > 4 ? step - (step % 2) : step < -4 ? step + ((-step) % 2) : 0;
      ctx.strokeStyle = "#8b91a0";
      ctx.lineWidth = 1;
      if (step > 4) {
        for (let s = 6; s <= evenLimit; s += 2) {
          const ly = midY - s * (SCORE.space / 2);
          ctx.beginPath();
          ctx.moveTo(x - 8, ly);
          ctx.lineTo(x + 8, ly);
          ctx.stroke();
        }
      } else if (step < -4) {
        for (let s = -6; s >= evenLimit; s -= 2) {
          const ly = midY - s * (SCORE.space / 2);
          ctx.beginPath();
          ctx.moveTo(x - 8, ly);
          ctx.lineTo(x + 8, ly);
          ctx.stroke();
        }
      }
      const endSemis = bendSemis(line, note.end);
      const startSemis = bendSemis(line, note.start);
      ctx.strokeStyle = "#e4e6eb";
      ctx.fillStyle = "#e4e6eb";
      if (clef === "perc") {
        ctx.beginPath();
        ctx.moveTo(x - 4, y - 4);
        ctx.lineTo(x + 4, y + 4);
        ctx.moveTo(x + 4, y - 4);
        ctx.lineTo(x - 4, y + 4);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.ellipse(x, y, 5.5, 4, -0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        if (step >= 0) {
          ctx.moveTo(x - 5, y);
          ctx.lineTo(x - 5, y + 22);
        } else {
          ctx.moveTo(x + 5, y);
          ctx.lineTo(x + 5, y - 22);
        }
        ctx.stroke();
        if (IS_SHARP[note.note % 12]) {
          ctx.font = "12px 'Segoe UI', serif";
          ctx.fillText("♯", x - 16, y + 4);
        }
      }
      if (startSemis !== endSemis) {
        const y2 = yFor(note.note + endSemis - startSemis);
        const x2 = tickX(song, note.end);
        ctx.strokeStyle = "#d4a017";
        ctx.beginPath();
        ctx.moveTo(x + 6, y);
        ctx.quadraticCurveTo((x + x2) / 2, (y + y2) / 2 - 8, x2, y2);
        ctx.stroke();
      }
    }
    ctx.restore();
  });
  return { width, height };
}

function drawPlayhead(canvas, song, tick) {
  const width = parseFloat(canvas.style.width) || canvas.width;
  const height = parseFloat(canvas.style.height) || canvas.height;
  const dpr = window.devicePixelRatio || 1;
  if (canvas.width !== Math.floor(width * dpr) || canvas.height !== Math.floor(height * dpr)) {
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
  }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, width, height);
  if (tick == null) return;
  const x = tickX(song, tick);
  ctx.strokeStyle = "#d4a017";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x, 0);
  ctx.lineTo(x, height);
  ctx.stroke();
}


// MIDI preview uses one oscillator per line. SID preview runs the export
// player on SidMachine and streams the chip output.

class Transport {
  constructor() {
    this.ctx = null;
    this.mode = null;
    this.timer = 0;
    this.onframe = null;
    this.song = null;
    this.frame = 0;
    this.nodes = [];
  }

  audio() {
    if (!this.ctx) this.ctx = new AudioContext();
    if (this.ctx.state === "suspended") this.ctx.resume();
    return this.ctx;
  }

  stop() {
    if (this.timer) {
      clearInterval(this.timer);
      this.timer = 0;
    }
    this.stopPreview();
    for (const node of this.nodes) {
      try { node.stop && node.stop(); } catch (err) { /* already stopped */ }
      try { node.disconnect && node.disconnect(); } catch (err) { /* already gone */ }
    }
    this.nodes = [];
    this.sounding = [];
    this.mode = null;
    this.machine = null;
    if (this.proc) {
      try { this.proc.disconnect(); } catch (err) { /* already gone */ }
      this.proc.onaudioprocess = null;
      this.proc = null;
    }
  }

  stopPreview() {
    if (this.previewTimer) {
      clearInterval(this.previewTimer);
      this.previewTimer = 0;
    }
    for (const node of this.previewNodes || []) {
      try { node.stop && node.stop(); } catch (err) { /* already stopped */ }
      try { node.disconnect && node.disconnect(); } catch (err) { /* already gone */ }
    }
    this.previewNodes = [];
  }

  track(node, channel) {
    this.nodes.push(node);
    this.sounding.push({ node, channel });
  }

  silenceChannel(channel) {
    for (const item of this.sounding || []) {
      if (item.channel !== channel) continue;
      try { item.node.stop(); } catch (err) { /* already stopped */ }
    }
  }

  playing() {
    return this.mode;
  }

  playMidi(song, arrange, originTick) {
    this.stop();
    const ctx = this.audio();
    this.mode = "midi";
    this.song = song;
    this.arrange = arrange;
    this.originTick = Math.max(0, originTick || 0);
    this.startedAt = ctx.currentTime;
    this.t0 = this.startedAt + 0.05;
    const us = usAtTick(song, 0);
    this.secPerTick = (us / 1e6) / song.ppq;
    this.sounding = [];
    this.scheduleMidi(this.originTick);
    this.frame = 0;
    this.timer = setInterval(() => this.midiClock(), 20);
  }

  scheduleMidi(originTick) {
    const ctx = this.ctx;
    const song = this.song;
    for (const line of song.lines) {
      const row = this.arrange.lines[line.channel];
      if (row && row.mute) continue;
      const perc = line.channel === PERCUSSION_CHANNEL;
      for (const note of line.notes) {
        const endTick = Math.max(note.end, note.start + 1);
        if (endTick <= originTick) continue;
        const startTick = Math.max(note.start, originTick);
        const start = this.t0 + (startTick - originTick) * this.secPerTick;
        const end = this.t0 + (endTick - originTick) * this.secPerTick;
        const vel = note.vel || 100;
        if (perc) this.drum(ctx, start, end, note.note, vel, line.channel);
        else this.tone(ctx, start, end, 440 * 2 ** ((note.note - 69) / 12), "triangle", vel, line.channel);
      }
    }
  }

  midiNow() {
    const elapsed = this.ctx.currentTime - this.startedAt - 0.05;
    return this.originTick + Math.max(0, elapsed / this.secPerTick);
  }

  midiClock() {
    if (!this.ctx || !this.song) return;
    const tick = this.midiNow();
    if (this.onframe) this.onframe(tick);
    if (tick > this.song.maxTick + this.song.ppq) {
      this.stop();
      if (this.onend) this.onend();
    }
  }

  rescheduleMidi() {
    if (this.mode !== "midi" || !this.ctx) return;
    for (const item of this.sounding) {
      try { item.node.stop(); } catch (err) { /* already stopped */ }
    }
    this.sounding = [];
    this.nodes = this.nodes.filter((node) => node === this.master);
    const tick = this.midiNow();
    this.originTick = tick;
    this.startedAt = this.ctx.currentTime - 0.05;
    this.t0 = this.ctx.currentTime;
    this.scheduleMidi(tick);
  }

  tone(ctx, start, end, hz, type, velocity, channel) {
    const dur = Math.max(0, end - start);
    const attack = Math.min(0.004, Math.max(0.001, dur * 0.3));
    const peak = Math.max(0.0002, 0.16 * (Math.max(1, velocity || 100) / 127));
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(hz, start);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(peak, start + attack);
    const releaseAt = Math.max(end, start + attack);
    if (releaseAt > start + attack + 0.0005) gain.gain.setValueAtTime(peak, releaseAt);
    gain.gain.exponentialRampToValueAtTime(0.0001, releaseAt + 0.012);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(start);
    osc.stop(releaseAt + 0.03);
    this.track(osc, channel);
  }

  // GM channel 10 in these files is kick (36) and snare (38). The hit lasts
  // as long as the MIDI note, and velocity sets the level.
  drum(ctx, start, end, note, velocity, channel) {
    const dur = Math.max(0.02, end - start);
    const amount = Math.max(1, velocity || 100) / 127;
    if (note < 38) {
      this.pitchedHit(ctx, start, dur, 170, 48, 0.7 * amount, "sine", channel);
      this.noiseHit(ctx, start, Math.min(0.03, dur), 0.28 * amount, 0.5, "lowpass", 280, channel);
    } else {
      this.pitchedHit(ctx, start, Math.min(0.08, dur), 196, 168, 0.28 * amount, "triangle", channel);
      this.noiseHit(ctx, start, dur, 0.55 * amount, 1.7, "highpass", 900, channel);
    }
  }

  pitchedHit(ctx, start, dur, hz0, hz1, peak, type, channel) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(hz0, start);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, hz1), start + dur);
    const level = Math.max(0.0002, peak);
    gain.gain.setValueAtTime(level, start);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(start);
    osc.stop(start + dur + 0.02);
    this.track(osc, channel);
  }

  noiseBuffer(ctx) {
    if (this.noiseBuf && this.noiseBuf.sampleRate === ctx.sampleRate) return this.noiseBuf;
    const length = ctx.sampleRate;
    const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
    this.noiseBuf = buffer;
    return buffer;
  }

  noiseHit(ctx, start, dur, peak, rate, filterType, freq, channel) {
    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuffer(ctx);
    src.loop = true;
    src.playbackRate.setValueAtTime(rate, start);
    const filter = ctx.createBiquadFilter();
    filter.type = filterType;
    filter.frequency.setValueAtTime(freq, start);
    const gain = ctx.createGain();
    const level = Math.max(0.0002, peak);
    gain.gain.setValueAtTime(level, start);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    src.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    src.start(start);
    src.stop(start + dur + 0.02);
    this.track(src, channel);
  }

  playSid(song, arrange, instruments, originTick) {
    this.stop();
    const ctx = this.audio();
    this.mode = "sid";
    this.song = song;
    this.arrange = arrange;
    this.instruments = instruments;
    const image = buildRamImage(song, arrange, instruments, PLAYER_BYTES, PLAYER_LABELS);
    this.machine = new SidMachine(ctx.sampleRate);
    this.machine.load(image.body);
    const startFrame = tickToFrame(song, Math.max(0, originTick || 0));
    this.machine.seek(startFrame);
    this.proc = ctx.createScriptProcessor(2048, 0, 1);
    this.proc.onaudioprocess = (event) => {
      const out = event.outputBuffer.getChannelData(0);
      if (!this.machine) {
        out.fill(0);
        return;
      }
      try {
        this.machine.fill(out);
      } catch (err) {
        out.fill(0);
        console.error(err);
      }
    };
    this.proc.connect(ctx.destination);
    this.timer = setInterval(() => {
      if (this.onframe && this.machine) this.onframe(frameToTick(song, this.machine.frame));
    }, 40);
  }

  relayout() {
    if (this.mode === "midi") {
      this.rescheduleMidi();
      return;
    }
    if (this.mode !== "sid" || !this.machine) return;
    const frame = this.machine.frame;
    const image = buildRamImage(this.song, this.arrange, this.instruments, PLAYER_BYTES, PLAYER_LABELS);
    this.machine.load(image.body);
    this.machine.seek(frame);
  }

  audition(instrumentId, percussion, midiNote, seconds) {
    const ctx = this.audio();
    this.stopPreview();
    const frames = Math.max(1, Math.round((seconds || 0.5) * FRAME_HZ));
    const note = midiNote == null ? 60 : midiNote;
    const channel = percussion ? 9 : 0;
    const song = {
      name: "preview",
      ppq: 350,
      numer: 4,
      denom: 4,
      tempos: [{ tick: 0, us: 500000 }],
      maxTick: frames * 14,
      lines: [{
        channel,
        program: 0,
        notes: [{ start: 0, end: frames * 14, note, vel: 110 }],
        bends: [],
      }],
    };
    const arrange = {
      title: "preview",
      author: "",
      lines: { [channel]: { mute: false, voice: 1 } },
      voices: {
        1: { instrument: instrumentId, arp: false, percussion: !!percussion },
        2: { instrument: instrumentId, arp: false, percussion: false },
        3: { instrument: instrumentId, arp: false, percussion: false },
      },
    };
    const image = buildRamImage(song, arrange, INSTRUMENTS, PLAYER_BYTES, PLAYER_LABELS);
    const machine = new SidMachine(ctx.sampleRate);
    machine.load(image.body);
    const tail = Math.floor(ctx.sampleRate * 0.15);
    const pcm = new Float32Array(Math.floor(ctx.sampleRate * (seconds || 0.5)) + tail);
    machine.fill(pcm);
    const buffer = ctx.createBuffer(1, pcm.length, ctx.sampleRate);
    buffer.copyToChannel(pcm, 0);
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    src.connect(ctx.destination);
    src.start();
    this.previewNodes = [src];
  }
}


// Folder handle for music/, remembered in IndexedDB the same way the
// Quake64 and SquareDoom editors remember their project file.

const HANDLE_DB = "wolf64-music-editor";
const HANDLE_STORE = "handles";
const HANDLE_KEY = "music";

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(HANDLE_DB, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(HANDLE_STORE)) db.createObjectStore(HANDLE_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbPut(key, value) {
  const db = await openDb();
  await new Promise((resolve, reject) => {
    const tx = db.transaction(HANDLE_STORE, "readwrite");
    tx.objectStore(HANDLE_STORE).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
  db.close();
}

async function idbGet(key) {
  const db = await openDb();
  const value = await new Promise((resolve, reject) => {
    const tx = db.transaction(HANDLE_STORE, "readonly");
    const req = tx.objectStore(HANDLE_STORE).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
  db.close();
  return value;
}

async function ensurePermission(handle) {
  if (!handle.queryPermission) return true;
  const opts = { mode: "readwrite" };
  if ((await handle.queryPermission(opts)) === "granted") return true;
  return (await handle.requestPermission(opts)) === "granted";
}

async function storeMusicHandle(handle) {
  await idbPut(HANDLE_KEY, handle);
}

async function loadMusicHandle() {
  try {
    return await idbGet(HANDLE_KEY);
  } catch (err) {
    return null;
  }
}

async function readFile(handle) {
  const file = await handle.getFile();
  return new Uint8Array(await file.arrayBuffer());
}

async function writeFile(dir, name, bytes) {
  const handle = await dir.getFileHandle(name, { create: true });
  const writable = await handle.createWritable();
  await writable.write(bytes);
  await writable.close();
}

async function listMusic(dir) {
  const mids = [];
  const sids = [];
  for await (const [name, handle] of dir.entries()) {
    if (handle.kind !== "file") continue;
    if (/\.mid$/i.test(name)) mids.push(name);
    else if (/\.sid$/i.test(name)) sids.push(name);
  }
  mids.sort((a, b) => a.localeCompare(b));
  sids.sort((a, b) => a.localeCompare(b));
  return { mids, sids };
}



let musicDir = null;
let midiNames = [];
let song = null;
let songName = "";
let arrange = null;
let selected = null;
let saveTimer = 0;
let cursorTick = 0;
let instQuery = "";
let instScroll = 0;
let kitKey = null;
const transport = new Transport();

const GM_DRUMS = {
  35: "Acoustic Kick", 36: "Kick", 37: "Side Stick", 38: "Snare", 39: "Clap",
  40: "Electric Snare", 41: "Low Floor Tom", 42: "Closed Hi-hat", 43: "High Floor Tom",
  44: "Pedal Hi-hat", 45: "Low Tom", 46: "Open Hi-hat", 47: "Low-mid Tom",
  48: "Hi-mid Tom", 49: "Crash", 50: "High Tom", 51: "Ride", 52: "China",
  53: "Ride Bell", 54: "Tambourine", 55: "Splash", 56: "Cowbell", 57: "Crash 2",
  58: "Vibraslap", 59: "Ride 2", 60: "High Bongo", 61: "Low Bongo",
  62: "Mute High Conga", 63: "Open High Conga", 64: "Low Conga", 65: "High Timbale",
  66: "Low Timbale", 67: "High Agogo", 68: "Low Agogo", 69: "Cabasa", 70: "Maracas",
  71: "Short Whistle", 72: "Long Whistle", 73: "Short Guiro", 74: "Long Guiro",
  75: "Claves", 76: "High Woodblock", 77: "Low Woodblock", 78: "Mute Cuica",
  79: "Open Cuica", 80: "Mute Triangle", 81: "Open Triangle",
};

function drumName(key) {
  return GM_DRUMS[key] || `Drum ${key}`;
}

const scoreCanvas = () => document.getElementById("score");
const headCanvas = () => document.getElementById("playhead");

function setStatus(text, isError) {
  const el = document.getElementById("status");
  el.textContent = text || "";
  el.classList.toggle("error", !!isError);
}

function sidecarName(name) {
  return name.replace(/\.mid$/i, "") + ".w64m.json";
}

function sidFileName(name) {
  return name.replace(/\.mid$/i, "") + ".sid";
}

async function chooseFolder() {
  if (!window.showDirectoryPicker) {
    setStatus("This editor needs a Chromium browser so it can read the music folder.", true);
    return;
  }
  const handle = await window.showDirectoryPicker({ mode: "readwrite" });
  await storeMusicHandle(handle);
  await openFolder(handle);
}

async function openFolder(handle) {
  if (!(await ensurePermission(handle))) {
    document.getElementById("file-gate").classList.remove("hidden");
    return;
  }
  musicDir = handle;
  document.getElementById("file-gate").classList.add("hidden");
  const listed = await listMusic(handle);
  midiNames = listed.mids;
  renderSongs();
  if (!midiNames.length) {
    setStatus("No .mid files in that folder.", true);
    return;
  }
  const keep = midiNames.includes(songName) ? songName : midiNames[0];
  await openSong(keep);
}

function renderSongs() {
  const ul = document.getElementById("song-list");
  ul.innerHTML = "";
  for (const name of midiNames) {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = name;
    btn.className = name === songName ? "current" : "";
    btn.addEventListener("click", () => openSong(name));
    li.appendChild(btn);
    ul.appendChild(li);
  }
}

async function openSong(name) {
  transport.stop();
  setPlayButtons(null);
  const handle = await musicDir.getFileHandle(name);
  const bytes = await readFile(handle);
  songName = name;
  song = parseMidi(bytes, name);
  let saved = null;
  try {
    const side = await musicDir.getFileHandle(sidecarName(name));
    saved = JSON.parse(new TextDecoder().decode(await readFile(side)));
  } catch (err) {
    saved = null;
  }
  arrange = normalizeArrangement(song, saved, INSTRUMENTS);
  selected = song.lines.length ? song.lines[0].channel : null;
  cursorTick = 0;
  instQuery = "";
  instScroll = 0;
  kitKey = null;
  renderSongs();
  renderLines();
  renderInspector();
  redraw();
  setStatus(`${name}  ·  ${barCount(song)} bars  ·  ${song.lines.length} lines`);
}

function renderLines() {
  const ul = document.getElementById("line-list");
  ul.innerHTML = "";
  if (!song) return;
  for (const line of song.lines) {
    const row = arrange.lines[line.channel];
    const li = document.createElement("li");
    li.className = "line-row" + (selected === line.channel ? " current" : "");
    const name = document.createElement("button");
    name.type = "button";
    name.className = "line-name";
    name.textContent = lineLabel(line);
    name.addEventListener("click", () => selectLine(line.channel));
    const mute = document.createElement("button");
    mute.type = "button";
    mute.className = "tiny" + (row.mute ? " active" : "");
    mute.textContent = row.mute ? "Muted" : "Mute";
    mute.addEventListener("click", () => {
      row.mute = !row.mute;
      changed();
    });
    const voice = document.createElement("button");
    voice.type = "button";
    voice.className = "tiny voice-chip" + (row.voice && arrange.voices[row.voice].percussion ? " drum" : "");
    voice.textContent = row.voice ? `V${row.voice}` : "—";
    voice.title = "Cycle SID voice. The same voice merges lines.";
    voice.addEventListener("click", () => {
      const next = (row.voice + 1) % 4;
      row.voice = next;
      if (line.channel === PERCUSSION_CHANNEL && next) {
        for (let v = 1; v <= 3; v++) arrange.voices[v].percussion = v === next;
      }
      changed();
    });
    li.append(name, mute, voice);
    ul.appendChild(li);
  }
}

function selectLine(channel) {
  selected = channel;
  instQuery = "";
  kitKey = null;
  renderLines();
  renderInspector({ scrollToCurrent: true });
  redraw();
}

function quarterSeconds() {
  if (!song) return 0.5;
  return usAtTick(song, cursorTick) / 1e6;
}

function linePitch(line) {
  const notes = line.notes.map((note) => note.note).sort((a, b) => a - b);
  return notes[Math.floor(notes.length / 2)] || 60;
}

function auditionLine(line) {
  const row = arrange.lines[line.channel];
  const spec = row && row.voice ? arrange.voices[row.voice] : null;
  if (spec && spec.percussion) {
    auditionDrum(spec, linePitch(line));
    return;
  }
  transport.audition(spec && spec.instrument, false, linePitch(line), quarterSeconds());
}

function auditionDrum(spec, key) {
  const entry = kitEntry(spec, key);
  transport.audition(entry.instrument, true, entry.note, quarterSeconds());
}

function auditionInstrument(spec) {
  if (spec.percussion && kitKey != null) auditionDrum(spec, kitKey);
  else transport.audition(spec.instrument, !!spec.percussion, 60, quarterSeconds());
  if (transport.playing() === "sid") transport.relayout();
}

// Drum keys on the lines that feed this voice, with hit counts.
function voiceDrumKeys(voice) {
  const counts = new Map();
  for (const line of song.lines) {
    const row = arrange.lines[line.channel];
    if (!row || row.voice !== voice) continue;
    for (const note of line.notes) counts.set(note.note, (counts.get(note.note) || 0) + 1);
  }
  return Array.from(counts.entries()).sort((a, b) => a[0] - b[0]);
}

function renderKit(root, spec, voice) {
  const keys = voiceDrumKeys(voice);
  if (!keys.length) return;
  if (kitKey != null && !keys.some(([key]) => key === kitKey)) kitKey = null;
  const heading = document.createElement("p");
  heading.className = "field-label";
  heading.textContent = "Drum kit";
  root.appendChild(heading);
  const list = document.createElement("ul");
  list.className = "kit-list";
  const addRow = (key, label, detail) => {
    const li = document.createElement("li");
    li.className = "kit-row" + (kitKey === key ? " current" : "");
    li.dataset.key = key == null ? "" : String(key);
    const pick = document.createElement("button");
    pick.type = "button";
    pick.className = "kit-pick";
    pick.innerHTML = `<span class="kit-name"></span><span class="kit-ins"></span>`;
    pick.querySelector(".kit-name").textContent = label;
    pick.querySelector(".kit-ins").textContent = detail;
    pick.addEventListener("click", () => {
      kitKey = key;
      instQuery = "";
      renderInspector({ scrollToCurrent: true });
      if (key == null) auditionInstrument(spec);
      else auditionDrum(spec, key);
    });
    li.appendChild(pick);
    if (key != null) {
      const pitch = document.createElement("input");
      pitch.type = "number";
      pitch.min = "0";
      pitch.max = "127";
      pitch.className = "kit-pitch";
      pitch.title = "MIDI note the SID plays for this drum";
      pitch.value = String(kitEntry(spec, key).note);
      pitch.addEventListener("click", (event) => event.stopPropagation());
      pitch.addEventListener("change", () => {
        const n = Math.max(0, Math.min(127, Math.round(Number(pitch.value))));
        const entry = { ...(spec.kit[key] || {}) };
        if (!Number.isFinite(n) || n === key) delete entry.note;
        else entry.note = n;
        if (Object.keys(entry).length) spec.kit[key] = entry;
        else delete spec.kit[key];
        changed();
        auditionDrum(spec, key);
      });
      li.appendChild(pitch);
    }
    list.appendChild(li);
  };
  addRow(null, "Default", kitLabel(spec, null));
  for (const [key, count] of keys) addRow(key, `${key} ${drumName(key)} ×${count}`, kitLabel(spec, key));
  root.appendChild(list);
}

function kitLabel(spec, key) {
  if (key == null) return spec.instrument || "—";
  return (spec.kit[key] && spec.kit[key].instrument) || "default";
}

function refreshKitLabels(spec) {
  document.querySelectorAll("#inspector .kit-row").forEach((li) => {
    const key = li.dataset.key === "" ? null : Number(li.dataset.key);
    li.querySelector(".kit-ins").textContent = kitLabel(spec, key);
  });
}

function renderInspector(opts) {
  const root = document.getElementById("inspector");
  root.innerHTML = "";
  if (!song || !arrange) return;
  if (selected == null) {
    renderSongFields(root);
    return;
  }
  const line = song.lines.find((item) => item.channel === selected);
  if (!line) {
    renderSongFields(root);
    return;
  }
  const row = arrange.lines[line.channel];
  const title = document.createElement("h2");
  title.textContent = lineLabel(line);
  root.appendChild(title);
  const meta = document.createElement("p");
  meta.className = "muted";
  meta.textContent = `${line.notes.length} notes`;
  root.appendChild(meta);

  const mute = document.createElement("label");
  mute.className = "check";
  mute.innerHTML = `<input type="checkbox" ${row.mute ? "checked" : ""}/> Mute`;
  mute.querySelector("input").addEventListener("change", (event) => {
    row.mute = event.target.checked;
    changed();
  });
  root.appendChild(mute);

  const voiceField = document.createElement("label");
  voiceField.className = "field";
  voiceField.innerHTML = `<span>SID voice</span>`;
  const voice = document.createElement("select");
  [["0", "Off"], ["1", "Voice 1"], ["2", "Voice 2"], ["3", "Voice 3"]].forEach(([value, label]) => {
    const opt = document.createElement("option");
    opt.value = value;
    opt.textContent = label;
    if (String(row.voice) === value) opt.selected = true;
    voice.appendChild(opt);
  });
  voice.addEventListener("change", () => {
    row.voice = Number(voice.value);
    if (line.channel === PERCUSSION_CHANNEL && row.voice) {
      for (let v = 1; v <= 3; v++) arrange.voices[v].percussion = v === row.voice;
    }
    changed();
  });
  voiceField.appendChild(voice);
  root.appendChild(voiceField);

  if (!row.voice) {
    const note = document.createElement("p");
    note.className = "muted";
    note.textContent = "Unassigned lines play in MIDI preview and stay out of the SID.";
    root.appendChild(note);
    renderSongFields(root);
    return;
  }

  const spec = arrange.voices[row.voice];
  const drum = document.createElement("label");
  drum.className = "check";
  drum.innerHTML = `<input type="checkbox" ${spec.percussion ? "checked" : ""}/> Drum channel`;
  drum.querySelector("input").addEventListener("change", (event) => {
    for (let v = 1; v <= 3; v++) arrange.voices[v].percussion = false;
    spec.percussion = event.target.checked;
    if (spec.percussion && !spec.instrument) spec.instrument = suggestInstrument(INSTRUMENTS, null, true);
    changed();
  });
  root.appendChild(drum);

  if (!spec.percussion) {
    const arp = document.createElement("label");
    arp.className = "check";
    arp.innerHTML = `<input type="checkbox" ${spec.arp ? "checked" : ""}/> Arpeggio when notes overlap`;
    arp.querySelector("input").addEventListener("change", (event) => {
      spec.arp = event.target.checked;
      changed();
    });
    root.appendChild(arp);
  }

  if (spec.percussion) renderKit(root, spec, row.voice);
  const drumTarget = spec.percussion && kitKey != null;
  const currentId = () => (drumTarget ? kitEntry(spec, kitKey).instrument : spec.instrument);
  const setCurrent = (id) => {
    if (!drumTarget) {
      spec.instrument = id;
      return;
    }
    const entry = { ...(spec.kit[kitKey] || {}) };
    if (id === spec.instrument) delete entry.instrument;
    else entry.instrument = id;
    if (Object.keys(entry).length) spec.kit[kitKey] = entry;
    else delete spec.kit[kitKey];
  };
  const search = document.createElement("label");
  search.className = "field";
  search.innerHTML = "<span></span>";
  search.querySelector("span").textContent = drumTarget
    ? `SID instrument for ${kitKey} ${drumName(kitKey)}`
    : spec.percussion ? `Default drum instrument (voice ${row.voice})` : `SID instrument for voice ${row.voice}`;
  const input = document.createElement("input");
  input.type = "text";
  input.className = "inst-search";
  input.placeholder = "Search the SID-Wizard collection";
  input.value = instQuery;
  search.appendChild(input);
  root.appendChild(search);
  const list = document.createElement("ul");
  list.className = "inst-list";
  root.appendChild(list);
  const matches = (item, q) => !q || item.id.toLowerCase().includes(q) || item.name.toLowerCase().includes(q);
  const fill = () => {
    const q = input.value.trim().toLowerCase();
    list.innerHTML = "";
    let shown = INSTRUMENTS.filter((item) => matches(item, q)).slice(0, 80);
    const current = INSTRUMENTS.find((item) => item.id === currentId());
    if (current && matches(current, q) && !shown.some((item) => item.id === current.id)) shown.unshift(current);
    for (const item of shown) {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = item.id;
      btn.title = item.name;
      if (item.id === currentId()) btn.className = "current";
      btn.addEventListener("click", () => {
        setCurrent(item.id);
        instScroll = list.scrollTop;
        list.querySelectorAll("button").forEach((el) => el.classList.toggle("current", el.textContent === item.id));
        if (spec.percussion) refreshKitLabels(spec);
        scheduleSave();
        updateSize();
        auditionInstrument(spec);
      });
      li.appendChild(btn);
      list.appendChild(li);
    }
  };
  input.addEventListener("input", () => {
    instQuery = input.value;
    fill();
  });
  let scrollLock = false;
  list.addEventListener("scroll", () => {
    if (!scrollLock) instScroll = list.scrollTop;
  });
  fill();
  scrollLock = true;
  if (opts && opts.scrollToCurrent) {
    const cur = list.querySelector("button.current");
    if (cur) cur.scrollIntoView({ block: "nearest" });
  } else {
    list.scrollTop = instScroll;
  }
  scrollLock = false;
  renderSongFields(root);
}

function renderSongFields(root) {
  const heading = document.createElement("h2");
  heading.textContent = "Song";
  heading.style.marginTop = "1rem";
  root.appendChild(heading);
  const title = document.createElement("label");
  title.className = "field";
  title.innerHTML = "<span>Title</span>";
  const titleInput = document.createElement("input");
  titleInput.type = "text";
  titleInput.value = arrange.title;
  titleInput.addEventListener("change", () => {
    arrange.title = titleInput.value.trim() || song.name;
    scheduleSave();
    updateSize();
  });
  title.appendChild(titleInput);
  root.appendChild(title);
  const author = document.createElement("label");
  author.className = "field";
  author.innerHTML = "<span>Author</span>";
  const authorInput = document.createElement("input");
  authorInput.type = "text";
  authorInput.value = arrange.author;
  authorInput.addEventListener("change", () => {
    arrange.author = authorInput.value;
    scheduleSave();
  });
  author.appendChild(authorInput);
  root.appendChild(author);
  const size = document.createElement("p");
  size.id = "size-line";
  size.className = "muted size-line";
  root.appendChild(size);
  updateSize();
}

function updateSize() {
  const el = document.getElementById("size-line");
  if (!el || !song || !arrange) return;
  const built = buildSid(song, arrange, INSTRUMENTS, PLAYER_BYTES, PLAYER_LABELS);
  const p = built.parts;
  const voiceText = p.voices.map((n, i) => `v${i + 1} ${n}`).join("  ");
  el.textContent = `${p.total}/${p.limit} bytes  ·  player ${p.player}  ·  ${voiceText}`;
  el.classList.toggle("over", !built.ok);
  if (!built.ok) el.title = built.error;
}

function changed() {
  const list = document.querySelector("#inspector .inst-list");
  if (list) instScroll = list.scrollTop;
  renderLines();
  renderInspector();
  redraw();
  scheduleSave();
  transport.relayout();
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveSidecar, 300);
}

async function saveSidecar() {
  if (!musicDir || !arrange || !songName) return;
  const payload = JSON.stringify(arrange, null, 2);
  await writeFile(musicDir, sidecarName(songName), new TextEncoder().encode(payload));
}

function shownTick() {
  if (transport.playing()) return transport.heardTick || 0;
  return cursorTick;
}

function redraw() {
  if (!song || !arrange) return;
  const score = scoreCanvas();
  const head = headCanvas();
  const box = drawScore(score, song, arrange, selected);
  head.style.width = `${box.width}px`;
  head.style.height = `${box.height}px`;
  drawPlayhead(head, song, shownTick());
}

function seekTo(tick) {
  cursorTick = Math.max(0, Math.min(song.maxTick, tick));
  const mode = transport.playing();
  if (mode) play(mode, true);
  else drawPlayhead(headCanvas(), song, cursorTick);
}

function scrollPlayhead(tick) {
  const scroller = document.getElementById("score-scroll");
  const x = tickX(song, tick);
  const pad = 80;
  if (x < scroller.scrollLeft + pad || x > scroller.scrollLeft + scroller.clientWidth - pad) {
    scroller.scrollLeft = Math.max(0, x - scroller.clientWidth * 0.25);
  }
}

function setPlayButtons(mode) {
  document.getElementById("btn-midi").classList.toggle("active", mode === "midi");
  document.getElementById("btn-sid").classList.toggle("active", mode === "sid");
}

function play(mode, restart) {
  if (!song || !arrange) return;
  if (!restart && transport.playing() === mode) {
    cursorTick = transport.heardTick || cursorTick;
    transport.stop();
    setPlayButtons(null);
    drawPlayhead(headCanvas(), song, cursorTick);
    return;
  }
  transport.onend = () => {
    cursorTick = 0;
    setPlayButtons(null);
    if (song) drawPlayhead(headCanvas(), song, 0);
  };
  transport.onframe = (tick) => {
    transport.heardTick = tick;
    drawPlayhead(headCanvas(), song, tick);
    scrollPlayhead(tick);
  };
  transport.heardTick = cursorTick;
  if (mode === "midi") transport.playMidi(song, arrange, cursorTick);
  else transport.playSid(song, arrange, INSTRUMENTS, cursorTick);
  setPlayButtons(mode);
  setStatus(mode === "midi" ? "Playing MIDI" : "Playing SID preview");
}

async function exportSid() {
  if (!song || !arrange || !musicDir) return;
  const built = buildSid(song, arrange, INSTRUMENTS, PLAYER_BYTES, PLAYER_LABELS);
  updateSize();
  if (!built.ok) {
    setStatus(built.error, true);
    return;
  }
  const name = sidFileName(songName);
  await writeFile(musicDir, name, built.bytes);
  setStatus(`Wrote ${name} (${built.parts.total} bytes).`);
}

function bootClicks() {
  document.getElementById("btn-folder").addEventListener("click", () => chooseFolder().catch((err) => setStatus(err.message, true)));
  document.getElementById("btn-gate").addEventListener("click", () => chooseFolder().catch((err) => setStatus(err.message, true)));
  document.getElementById("btn-midi").addEventListener("click", () => play("midi"));
  document.getElementById("btn-sid").addEventListener("click", () => play("sid"));
  document.getElementById("btn-stop").addEventListener("click", () => {
    if (transport.playing()) cursorTick = transport.heardTick || cursorTick;
    transport.stop();
    setPlayButtons(null);
    if (song) drawPlayhead(headCanvas(), song, cursorTick);
  });
  document.getElementById("btn-export").addEventListener("click", () => exportSid().catch((err) => setStatus(err.message, true)));
  document.getElementById("btn-song").addEventListener("click", () => selectLine(null));
  document.getElementById("score-scroll").addEventListener("click", (event) => {
    if (!song) return;
    const rect = scoreCanvas().getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    const rows = song.lines.length * SCORE.rowH;
    const line = y >= 0 && y < rows ? song.lines[Math.floor(y / SCORE.rowH)] : null;
    if (!line) {
      seekTo(xToTick(song, x));
      return;
    }
    selectLine(line.channel);
    auditionLine(line);
  });
  window.addEventListener("resize", () => redraw());
}

async function boot() {
  bootClicks();
  const stored = await loadMusicHandle();
  if (stored && (await ensurePermission(stored).catch(() => false))) {
    await openFolder(stored);
    return;
  }
  document.getElementById("file-gate").classList.remove("hidden");
}

boot().catch((err) => setStatus(err.message, true));

  </script>
</body>
